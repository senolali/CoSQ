[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosq"
version = "0.2.0"
description = "Chain-of-Self-Questioning for selective risk control and abstention in LLMs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ali Senol", email = "alisenol@tarsus.edu.tr" }]
keywords = ["llm", "hallucination", "abstention", "selective-prediction", "risk-coverage", "question-answering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24,<2.4", "scipy>=1.10", "PyYAML>=6.0", "requests>=2.31"]

[project.optional-dependencies]
hf = ["torch>=2.0", "transformers>=4.40", "accelerate>=0.30", "bitsandbytes>=0.43", "datasets>=2.18"]
openai = ["openai>=1.0"]
dev = ["pytest>=8.0,<9", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11,<2", "types-PyYAML", "build>=1.2", "twine>=5.0"]

[project.scripts]
cosq = "cosq.cli:main"

[project.urls]
Homepage = "https://github.com/senolali/cosq"
Repository = "https://github.com/senolali/cosq"
Issues = "https://github.com/senolali/cosq/issues"
Documentation = "https://github.com/senolali/cosq#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/cosq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider"
markers = ["slow: deselect with -m 'not slow'"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/cosq"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy.*", "yaml.*", "torch.*", "transformers.*", "datasets.*", "requests.*", "openai.*"]
ignore_missing_imports = true
